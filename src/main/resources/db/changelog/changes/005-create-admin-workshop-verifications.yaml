databaseChangeLog:
  - changeSet:
      id: 005-create-admin-workshop-verifications
      author: system
      comment: >
        ADMIN-US-06 — one tracking row per (workshop, verification type)
        pair, synced lazily on read for the same reason as
        workshop_registration_requests. Kept separate from the sibling's
        workshop_verifications table, which is unique on mechanic_id and
        read by the sibling as one row per mechanic.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: admin_workshop_verifications
      changes:
        - createTable:
            tableName: admin_workshop_verifications
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: mechanic_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: verification_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(30)
                  defaultValue: PENDING
                  constraints:
                    nullable: false

              - column:
                  name: requested_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: decision_reason
                  type: TEXT

              - column:
                  name: decided_by_admin_id
                  type: BIGINT

              - column:
                  name: decided_at
                  type: TIMESTAMP

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: admin_workshop_verifications
            columnNames: mechanic_id, verification_type
            constraintName: uq_admin_workshop_verification_mechanic_type

        - addForeignKeyConstraint:
            baseTableName: admin_workshop_verifications
            baseColumnNames: mechanic_id
            constraintName: fk_admin_workshop_verification_mechanic
            referencedTableName: users
            referencedColumnNames: id

        - addForeignKeyConstraint:
            baseTableName: admin_workshop_verifications
            baseColumnNames: decided_by_admin_id
            constraintName: fk_admin_workshop_verification_admin
            referencedTableName: admin_users
            referencedColumnNames: id

        - createIndex:
            indexName: idx_admin_workshop_verification_type_status_requested_at
            tableName: admin_workshop_verifications
            columns:
              - column:
                  name: verification_type
              - column:
                  name: status
              - column:
                  name: requested_at

      rollback:
        - dropTable:
            tableName: admin_workshop_verifications
