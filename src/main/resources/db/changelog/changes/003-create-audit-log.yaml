databaseChangeLog:
  - changeSet:
      id: 003-create-audit-log
      author: system
      comment: >
        Shared, append-only audit trail reused across admin-portal features —
        every state-changing admin action writes one row here (never edited
        or deleted from the portal).
      changes:
        - createTable:
            tableName: audit_log
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: entity_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: entity_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: action
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: performed_by_admin_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: previous_status
                  type: VARCHAR(50)

              - column:
                  name: new_status
                  type: VARCHAR(50)

              - column:
                  name: reason
                  type: TEXT

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: audit_log
            baseColumnNames: performed_by_admin_id
            constraintName: fk_audit_log_admin_user
            referencedTableName: admin_users
            referencedColumnNames: id

        - createIndex:
            indexName: idx_audit_log_entity
            tableName: audit_log
            columns:
              - column:
                  name: entity_type
              - column:
                  name: entity_id

      rollback:
        - dropTable:
            tableName: audit_log
