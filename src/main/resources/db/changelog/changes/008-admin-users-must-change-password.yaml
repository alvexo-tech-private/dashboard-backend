databaseChangeLog:
  # Admin user management (ADMIN-US-29): accounts created by a Super Admin, or
  # whose password a Super Admin resets, get a one-time temporary password and
  # must choose their own at first sign-in. Existing (seeded) accounts are left
  # as they are.
  - changeSet:
      id: 008-admin-users-must-change-password
      author: system
      changes:
        - addColumn:
            tableName: admin_users
            columns:
              - column:
                  name: must_change_password
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: admin_users
            columnName: must_change_password
