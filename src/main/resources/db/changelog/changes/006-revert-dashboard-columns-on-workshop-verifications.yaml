databaseChangeLog:
  # Undoes the columns an earlier version of this changelog added to the
  # sibling-owned workshop_verifications table. They must go: requested_at is
  # NOT NULL with no default, and the sibling's own insert
  # (WorkshopProfileService.getOrCreateVerification) never sets it. Every
  # changeSet is guarded, so on a database that never had them this is a no-op.
  # (Copying those rows anywhere is no longer needed: the Trust queue now works
  # on workshop_verifications.verified directly.)

  - changeSet:
      id: 006-drop-verification-type-from-workshop-verifications
      author: system
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: workshop_verifications
            columnName: verification_type
      changes:
        - dropColumn:
            tableName: workshop_verifications
            columnName: verification_type

  - changeSet:
      id: 006-drop-status-from-workshop-verifications
      author: system
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: workshop_verifications
            columnName: status
      changes:
        - dropColumn:
            tableName: workshop_verifications
            columnName: status

  - changeSet:
      id: 006-drop-requested-at-from-workshop-verifications
      author: system
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: workshop_verifications
            columnName: requested_at
      changes:
        - dropColumn:
            tableName: workshop_verifications
            columnName: requested_at

  - changeSet:
      id: 006-drop-decision-reason-from-workshop-verifications
      author: system
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: workshop_verifications
            columnName: decision_reason
      changes:
        - dropColumn:
            tableName: workshop_verifications
            columnName: decision_reason

  - changeSet:
      id: 006-drop-decided-by-admin-id-from-workshop-verifications
      author: system
      comment: Dropping the column also drops fk_workshop_verification_admin.
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: workshop_verifications
            columnName: decided_by_admin_id
      changes:
        - dropColumn:
            tableName: workshop_verifications
            columnName: decided_by_admin_id

  - changeSet:
      id: 006-drop-decided-at-from-workshop-verifications
      author: system
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: workshop_verifications
            columnName: decided_at
      changes:
        - dropColumn:
            tableName: workshop_verifications
            columnName: decided_at

  - changeSet:
      id: 006-drop-created-at-from-workshop-verifications
      author: system
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: workshop_verifications
            columnName: created_at
      changes:
        - dropColumn:
            tableName: workshop_verifications
            columnName: created_at
