# Application Name
spring.application.name=dashboard-backend
#spring.profiles.active=prod
# Server — separate port/context-path from vehicle-service-booking-api (8080/vehiclserviceapi),
# since these are two independently deployed services.
server.port=8081
server.servlet.context-path=/adminapi
server.error.include-message=always
server.error.include-binding-errors=always

# Postgres — same physical database as vehicle-service-booking-api (see
# ../../vehicle-service-booking-api/src/main/resources/application.properties),
# read/written directly via this service's own JPA entities.
#spring.datasource.url=jdbc:postgresql://localhost:5432/bike_service_db_to
#spring.datasource.username=postgres
#spring.datasource.password=admin
spring.datasource.url=jdbc:postgresql://ep-falling-salad-azey682k.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_9EZwVXpkdU1c
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.default_schema=public

# JPA/Hibernate — never auto-generate/alter schema; Liquibase owns every change.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Liquibase — deliberately separate change-log history tables from
# vehicle-service-booking-api's (which use the Liquibase defaults,
# `databasechangelog`/`databasechangeloglock`). Both services migrate the
# same physical database independently, so sharing one history table would
# make each service see (and potentially conflict with) the other's
# changesets. This keeps dashboard-backend's migration history isolated.
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true
spring.liquibase.drop-first=false
spring.liquibase.default-schema=public
spring.liquibase.liquibase-schema=public
spring.liquibase.database-change-log-table=admin_databasechangelog
spring.liquibase.database-change-log-lock-table=admin_databasechangeloglock

# JWT — local dev secret only; replace via env var before any shared/deployed
# environment. This service issues its own admin tokens, independent of
# vehicle-service-booking-api's jwt.secret.
jwt.secret=${ADMIN_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.access-token.expiration=3600000
jwt.refresh-token.expiration=604800000

# CORS — origins allowed to call this API from a browser (see SecurityConfig).
# Defaults to the Angular dev server ports; override with a comma-separated
# list via env var once dashboard-frontend has a real deployed URL.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300}

# Swagger/OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.alvexo.adminportal=DEBUG
logging.level.org.hibernate.SQL=DEBUG
